name: Scaffold checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/check_scaffold.py
      - run: python scripts/check_project.py
      - run: python -m unittest discover -s tests/common -p 'test_*.py' -v
      - run: git diff --check
